apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkd-forms-deployment
  namespace: nkd
  labels:
    app.kubernetes.io/name: forms
spec:
  template:
    spec:
      containers:
        - name: nkd-forms
          env:
            - name: SPARQL_ENDPOINT
              value: "https://data.gov.cz/slovn%C3%ADky/sparql"
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "128Mi"
