apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkd-gateway-deployment
  namespace: nkd
  labels:
    app.kubernetes.io/name: gateway
spec:
  template:
    spec:
      tolerations:
        - key: dedicated
          operator: Equal
          value: gateway
          effect: NoSchedule
      # We do not need to deploy to a separate node group as of now.
      # nodeSelector:
      #   agentpool: gateway
      containers:
        - name: nkd-gateway
          resources:
            requests:
              memory: "256Mi"
              cpu: "800m"
            limits:
              memory: "512Mi"
